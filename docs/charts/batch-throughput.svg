<text x="132.0" y="193.1" class="v" text-anchor="middle">35.4</text>
<text x="132.0" y="342" class="a" text-anchor="middle">1</text>
<rect x="225.0" y="132.0" width="62.0" height="192.0" fill="#58a6ff" opacity="0.85" rx="2"/>
<line x1="256.0" y1="122.8" x2="256.0" y2="176.7" stroke="#c9d1d9" stroke-width="1.5" opacity="0.7"/>

<line x1="70" y1="157.2" x2="690" y2="157.2" stroke="#30363d" stroke-width="1"/>
<text x="62" y="161.2" class="a" text-anchor="end">48</text>
<line x1="70" y1="101.6" x2="690" y2="101.6" stroke="#30363d" stroke-width="1"/>
<text x="62" y="105.6" class="a" text-anchor="end">64</text>

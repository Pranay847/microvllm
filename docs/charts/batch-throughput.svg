<text x="380.0" y="342" class="a" text-anchor="middle">8</text>
<rect x="473.0" y="70.9" width="62.0" height="253.1" fill="#3fb950" opacity="0.85" rx="2"/>
<line x1="504.0" y1="70.0" x2="504.0" y2="73.6" stroke="#c9d1d9" stroke-width="1.5" opacity="0.7"/>
